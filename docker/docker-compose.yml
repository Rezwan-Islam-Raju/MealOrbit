services:

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: fastapi-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: food_delivery_redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

volumes:
  rabbitmq-data:
  redis-data: