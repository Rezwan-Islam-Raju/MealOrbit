services:

  postgres:
    image: postgres:17
    container_name: food_delivery_postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rezwan1122
      POSTGRES_DB: food_delivery_db

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food_delivery_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: fastapi-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s


  redis:
    image: redis:7-alpine
    container_name: food_delivery_redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data


volumes:
  postgres-data:
  rabbitmq-data:
  redis-data: